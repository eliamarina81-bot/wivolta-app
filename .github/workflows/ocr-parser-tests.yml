name: Wivolta OCR parser tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ocr-parser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run OCR parser regression tests
        run: node tests/ocr-parser.test.js
